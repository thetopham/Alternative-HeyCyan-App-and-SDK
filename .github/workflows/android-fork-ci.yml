name: Fork Android unit tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/android-fork-ci.yml
      - android/**
      - heycyan-core/**
      - third_party/moonshine
      - .gitmodules
  push:
    branches:
      - main
      - 'fix/**'
      - 'eyevue-**'
    paths:
      - .github/workflows/android-fork-ci.yml
      - android/**
      - heycyan-core/**
      - third_party/moonshine
      - .gitmodules

permissions:
  contents: read

concurrency:
  group: fork-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eyevue-unit-tests:
    if: github.repository == 'thetopham/Alternative-HeyCyan-App-and-SDK'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
        with:
          submodules: recursive
          lfs: false

      - name: Fetch required Moonshine LFS assets
        working-directory: third_party/moonshine
        run: >-
          git lfs pull
          --include="core/speaker-embedding-model-data.cpp,core/third-party/onnxruntime/lib/android/arm64/libonnxruntime.so"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Tasker integration contracts
        run: python3 tools/hil/validate_tasker_profiles.py

      - name: Run EyeVue protocol unit tests
        working-directory: android/CyanBridge
        run: >-
          ./gradlew --no-daemon --stacktrace
          :app:testDebugUnitTest
          --tests 'com.fersaiyan.cyanbridge.devices.eyevue.EyevueProtocolTest'

      - name: Upload unit-test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eyevue-unit-test-reports-${{ github.sha }}
          path: android/CyanBridge/app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore
          retention-days: 3
